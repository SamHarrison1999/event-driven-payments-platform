spring:
  application:
    name: payments-platform-backend

  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/payments_platform}
    username: ${DATABASE_USERNAME:payments_app}
    password: ${DATABASE_PASSWORD:payments_local_dev_only}

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true

  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db

    metrics:
      access: read-only

    prometheus:
      access: read-only

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}

  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

  opentelemetry:
    tracing:
      sampler: parent-based-trace-id-ratio
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

  observations:
    key-values:
      phase: phase-11

springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    disable-swagger-default-url: true

platform:
  name: Event-Driven Payments and Reconciliation Platform
  description: >-
    Educational simulation of payment processing and settlement
    reconciliation
  version: ${APP_VERSION:0.0.1-SNAPSHOT}
  educational: true
  real-money-processing: false

  failure-simulation:
    enabled: ${FAILURE_SIMULATION_ENABLED:false}
    max-delay: ${FAILURE_SIMULATION_MAX_DELAY:5000ms}

  security:
    rate-limit:
      enabled: ${SECURITY_RATE_LIMIT_ENABLED:true}
      window: ${SECURITY_RATE_LIMIT_WINDOW:1m}
      max-tracked-keys: ${SECURITY_RATE_LIMIT_MAX_TRACKED_KEYS:10000}
      login-requests: ${SECURITY_RATE_LIMIT_LOGIN_REQUESTS:10}
      registration-requests: ${SECURITY_RATE_LIMIT_REGISTRATION_REQUESTS:5}
      payment-requests: ${SECURITY_RATE_LIMIT_PAYMENT_REQUESTS:60}
      settlement-import-requests: ${SECURITY_RATE_LIMIT_SETTLEMENT_IMPORT_REQUESTS:10}

server:
  shutdown: graceful

  servlet:
    session:
      cookie:
        name: PAYMENTS_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: strict
        path: /api

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        version: ${APP_VERSION:0.0.1-SNAPSHOT}
