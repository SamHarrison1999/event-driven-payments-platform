spring:
  application:
    name: payments-platform-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/payments_platform}
    username: ${DATABASE_USERNAME:payments_app}
    password: ${DATABASE_PASSWORD:payments_local_dev_only}

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    disable-swagger-default-url: true

platform:
  name: Event-Driven Payments and Reconciliation Platform
  description: >-
    Educational simulation of payment processing and settlement
    reconciliation
  version: ${APP_VERSION:0.0.1-SNAPSHOT}
  educational: true
  real-money-processing: false

server:
  shutdown: graceful

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-}]"
